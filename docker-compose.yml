services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Merci de definir POSTGRES_PASSWORD dans le fichier .env}
      POSTGRES_DB: ${POSTGRES_DB:-audit}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-audit}
      SECRET_KEY: ${SECRET_KEY:?Merci de definir SECRET_KEY dans le fichier .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pilotage-audit.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Merci de definir ADMIN_PASSWORD dans le fichier .env}
      UPLOADS_DIR: /data/uploads
      CORS_ORIGINS: '["http://localhost:8080"]'
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
    volumes:
      - uploads_data:/data/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads_data:
