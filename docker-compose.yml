services:
  db:
    image: ${DOCKER_BASE_REGISTRY:-docker.io/library}/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Merci de definir POSTGRES_PASSWORD dans le fichier .env}
      POSTGRES_DB: ${POSTGRES_DB:-audit}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-audit}
      SECRET_KEY: ${SECRET_KEY:?Merci de definir SECRET_KEY dans le fichier .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pilotage-audit.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Merci de definir ADMIN_PASSWORD dans le fichier .env}
      UPLOADS_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:9090"]}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
    volumes:
      - uploads_data:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-9090}:80"

volumes:
  db_data:
  uploads_data:
